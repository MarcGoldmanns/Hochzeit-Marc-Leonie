<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marc & Leonie – 14. August 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#242D1D;
    --forest:#37432E;
    --parchment:#EFE8D6;
    --ink:#F4F1E6;
    --ink-dark:#2A2F22;
    --sage:#93A587;
    --gold:#C9A968;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--forest);color:var(--ink);
    font-family:'Jost', sans-serif;font-weight:300;line-height:1.7;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond', serif;font-weight:500;}
  img{max-width:100%;}

  /* ---------- HOME / HERO ---------- */
  .hero-mini{
    position:relative;height:64vh;min-height:420px;overflow:hidden;
  }
  .hero-mini img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.55;
  }
  .hero-mini::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(36,45,29,0.95) 5%, rgba(36,45,29,0.2) 60%, rgba(36,45,29,0.55) 100%);
  }
  .hero-mini-content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 40px;}
  .hero-mini-content h1{
    font-size:clamp(44px,10vw,96px);line-height:0.95;margin:0;
    opacity:0;animation:riseIn 1.1s ease 0.15s both;
  }
  .hero-mini-content .amp{font-style:italic;color:var(--gold);font-size:0.55em;display:block;margin:2px 0;}
  .hero-mini-meta{margin-top:16px;font-size:15px;color:var(--sage);opacity:0;animation:riseIn 1.1s ease 0.5s both;}
  .hero-mini-meta span{display:block;}
  @keyframes riseIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  .intro-line{
    text-align:center;max-width:520px;margin:0 auto;padding:44px 28px 8px;
    font-size:15px;color:var(--sage);
  }

  /* ---------- TILES ---------- */
  .tiles{
    display:grid;grid-template-columns:repeat(2,1fr);gap:4px;
    max-width:640px;margin:0 auto;padding:28px 24px 90px;
  }
  .tile{
    position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    cursor:pointer;border:none;padding:0;background:none;display:block;
  }
  .tile-slice{
    position:absolute;top:0;left:0;width:200%;height:200%;object-fit:cover;
    display:block;max-width:none;
  }
  .tile:nth-child(1) .tile-slice{transform:translate(0%,0%);}
  .tile:nth-child(2) .tile-slice{transform:translate(-50%,0%);}
  .tile:nth-child(3) .tile-slice{transform:translate(0%,-50%);}
  .tile:nth-child(4) .tile-slice{transform:translate(-50%,-50%);}
  .tile::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(36,45,29,0.88), rgba(36,45,29,0.05) 55%);
  }
  .tile span{
    position:absolute;left:14px;bottom:14px;right:14px;z-index:1;text-align:left;
    font-family:'Cormorant Garamond',serif;font-size:clamp(18px,2.6vw,23px);color:var(--ink);
  }
  .tile:active{outline:2px solid var(--gold);}

  footer{text-align:center;padding:20px 28px 90px;}
  footer .serif{font-size:26px;color:var(--gold);font-style:italic;margin-bottom:10px;}
  footer p{font-size:13px;margin:4px 0;color:var(--sage);}

  /* ---------- CHAPTER PANELS ---------- */
  .chapter{
    position:fixed;inset:0;z-index:70;background:var(--forest);color:var(--ink);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(100%);transition:transform 0.45s cubic-bezier(.22,.9,.32,1);
  }
  .chapter.open{transform:translateY(0);}
  .chapter.light{background:var(--parchment);color:var(--ink-dark);}

  .chapter-head{position:relative;height:34vh;min-height:200px;}
  .chapter-head img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .chapter-head::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(36,45,29,0.92), rgba(36,45,29,0.05));}
  .chapter-head h2{position:absolute;left:28px;bottom:22px;right:28px;z-index:1;font-size:clamp(32px,6vw,52px);margin:0;color:var(--ink);}

  .chapter-body{max-width:640px;margin:0 auto;padding:40px 28px 100px;}
  .chapter-body p{font-size:16px;}
  .chapter.light .chapter-body p{color:#54523F;}
  .chapter-body .note-line{font-size:14px;color:var(--gold);margin:0 0 22px;}
  .chapter.light .chapter-body .note-line{color:#8A7B45;}

  .chapter-close{
    position:fixed;top:18px;right:18px;z-index:80;width:44px;height:44px;border-radius:50%;
    background:rgba(36,45,29,0.7);color:var(--ink);border:none;font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .chapter-nav{
    display:flex;justify-content:space-between;max-width:640px;margin:0 auto;padding:10px 28px 70px;
  }
  .chapter-nav button{
    background:none;border:1px solid rgba(147,165,135,0.5);color:inherit;
    padding:10px 18px;border-radius:30px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;
  }
  .chapter.light .chapter-nav button{border-color:#C9BD94;}

  /* Ablauf timeline (sequence: numbers kept) */
  .timeline{list-style:none;margin:0;padding:0;}
  .timeline li{display:flex;gap:20px;padding:14px 0;border-top:1px solid rgba(147,165,135,0.25);}
  .timeline li:first-child{border-top:none;}
  .timeline .time{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold);flex:0 0 70px;}
  .timeline .what h3{margin:0 0 2px;font-size:19px;font-weight:500;color:var(--ink);}
  .timeline .what p{margin:0;font-size:14px;color:#B9C1A9;}

  /* RSVP */
  .rsvp-form{text-align:left;background:#F8F4E7;border:1px solid #DED2AC;padding:30px;border-radius:4px;}
  .rsvp-form label{display:block;font-size:12px;letter-spacing:0.06em;color:#7A7256;margin-bottom:6px;}
  .rsvp-form input, .rsvp-form select{
    width:100%;padding:11px 12px;margin-bottom:18px;border:1px solid #DED2AC;background:#FFFDF6;
    font-family:'Jost',sans-serif;font-size:14px;color:var(--ink-dark);border-radius:3px;
  }
  .rsvp-form input[type="checkbox"]{width:auto;margin:0;}
  .rsvp-form .checkbox-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dark);margin-bottom:18px;}
  .rsvp-form button{
    width:100%;padding:14px;background:var(--night);color:var(--ink);border:none;
    font-family:'Jost',sans-serif;font-size:13px;letter-spacing:0.08em;cursor:pointer;border-radius:3px;
  }
  .rsvp-note{text-align:center;font-size:12px;color:#8A7B45;margin-top:16px;font-style:italic;}

  /* ---------- PASSWORD GATE ---------- */
  #gate{
    position:fixed;inset:0;z-index:100;background:var(--forest);
    display:flex;align-items:center;justify-content:center;padding:28px;
  }
  #gate .box{text-align:center;max-width:340px;width:100%;}
  #gate h2{font-size:30px;color:var(--ink);margin:0 0 26px;}
  #gate input{
    width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid rgba(147,165,135,0.4);
    background:var(--night);font-family:'Jost',sans-serif;font-size:14px;color:var(--ink);
    border-radius:3px;text-align:center;
  }
  #gate button{
    width:100%;padding:13px;background:var(--gold);color:var(--night);border:none;
    font-family:'Jost',sans-serif;font-size:13px;letter-spacing:0.08em;cursor:pointer;border-radius:3px;
  }
  #gate .error{color:#D89B9B;font-size:13px;margin-top:12px;visibility:hidden;}
  #site{display:none;}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Willkommen</h2>
    <input type="password" id="gate-input" placeholder="Passwort" autocomplete="off">
    <button id="gate-submit">Weiter</button>
    <p class="error" id="gate-error">Falsches Passwort, bitte nochmal versuchen.</p>
  </div>
</div>

<div id="site"></div>

  var ENC_ITERATIONS = 250000;

  var gate = document.getElementById('gate');
  var site = document.getElementById('site');
  var input = document.getElementById('gate-input');
  var gateButton = document.getElementById('gate-submit');
  var error = document.getElementById('gate-error');

  function fromBase64(b64){
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
    return bytes;
  }

  async function tryUnlock(){
    error.style.visibility = 'hidden';
    try{
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(input.value), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: fromBase64(ENC_SALT), iterations: ENC_ITERATIONS, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      var plainBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromBase64(ENC_IV) },
        key,
        fromBase64(ENC_CIPHERTEXT)
      );
      var plainText = new TextDecoder().decode(plainBuf);
      site.innerHTML = plainText;
      gate.style.display = 'none';
      site.style.display = 'block';
      initSite();
    } catch(e){
      error.style.visibility = 'visible';
    }
  }

  gateButton.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ tryUnlock(); }
  });

  function initSite(){
    /* ---- RSVP dynamic fields ---- */
    var anzahlSelect = document.getElementById('anzahl');
    var feldPerson2 = document.getElementById('feld-person2');
    anzahlSelect.addEventListener('change', function(){
      feldPerson2.style.display = (anzahlSelect.value === '2') ? 'block' : 'none';
    });

    var kinderCheck = document.getElementById('kinder-check');
    var feldKinderAnzahl = document.getElementById('feld-kinder-anzahl');
    var kinderAnzahlSelect = document.getElementById('kinder-anzahl');
    var feldKindernamen = document.getElementById('feld-kindernamen');

    function renderKindernamen(){
      var anzahl = parseInt(kinderAnzahlSelect.value, 10);
      feldKindernamen.innerHTML = '';
      for(var i = 1; i <= anzahl; i++){
        var lbl = document.createElement('label');
        lbl.textContent = 'Name Kind ' + i;
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.placeholder = 'Vorname';
        feldKindernamen.appendChild(lbl);
        feldKindernamen.appendChild(inp);
      }
    }

    kinderCheck.addEventListener('change', function(){
      var checked = kinderCheck.checked;
      feldKinderAnzahl.style.display = checked ? 'block' : 'none';
      if(checked){ renderKindernamen(); } else { feldKindernamen.innerHTML = ''; }
    });
    kinderAnzahlSelect.addEventListener('change', renderKindernamen);

    /* ---- Chapter navigation ---- */
    var order = ['ablauf','location','zum-wohl','antwort'];

    function openChapter(id){
      document.querySelectorAll('.chapter').forEach(function(c){ c.classList.remove('open'); });
      var target = document.getElementById('chapter-' + id);
      if(target){
        target.classList.add('open');
        target.scrollTop = 0;
        document.body.style.overflow = 'hidden';
      }
    }
    function closeChapters(){
      document.querySelectorAll('.chapter').forEach(function(c){ c.classList.remove('open'); });
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.tile').forEach(function(t){
      t.addEventListener('click', function(){ openChapter(t.dataset.chapter); });
    });
    document.querySelectorAll('[data-close]').forEach(function(b){
      b.addEventListener('click', closeChapters);
    });
    document.querySelectorAll('[data-prev]').forEach(function(b){
      b.addEventListener('click', closeChapters);
    });
    document.querySelectorAll('[data-next]').forEach(function(b){
      b.addEventListener('click', function(){
        var current = b.closest('.chapter').id.replace('chapter-','');
        var idx = order.indexOf(current);
        if(idx > -1 && idx < order.length - 1){
          openChapter(order[idx + 1]);
        }
      });
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ closeChapters(); }
    });
  }
</script>
